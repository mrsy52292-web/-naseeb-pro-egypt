
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#741c45">
<title>نصيب | نصيبك في الحلال</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Tahoma,Arial,sans-serif;background:#fff7fa;color:#30212a}
header{background:#741c45;color:white;text-align:center;padding:25px}
header h1{margin:0;font-size:34px}
main{max-width:500px;margin:25px auto;padding:15px}
.card{background:white;border:1px solid #f0dbe5;border-radius:18px;padding:22px;box-shadow:0 5px 20px #741c4510}
h2{color:#741c45}
label{display:block;margin:14px 0 6px}
input,select{width:100%;padding:12px;border:1px solid #dfc5d2;border-radius:9px;font:inherit}
button{width:100%;padding:13px;margin-top:14px;border:0;border-radius:10px;background:#741c45;color:white;font-size:16px}
.alt{background:#f7e8ef;color:#741c45}
#msg{line-height:1.8;overflow-wrap:anywhere}
footer{text-align:center;padding:20px;color:#77616d}
</style>
</head>
<body>
<header>
<h1>نصيب ❤️</h1>
<p>نصيبك في الحلال</p>
</header>

<main>
<section class="card">
<h2 id="title">إنشاء حساب جديد</h2>
<form id="authForm">
<div id="extra">
<label for="name">الاسم</label>
<input id="name" maxlength="80" required>

<label for="birth">تاريخ الميلاد</label>
<input id="birth" type="date" required>

<label for="gender">النوع</label>
<select id="gender" required>
<option value="">اختر النوع</option>
<option value="male">ذكر</option>
<option value="female">أنثى</option>
</select>

<label for="city">المدينة</label>
<input id="city" maxlength="80" required>
</div>

<label for="email">البريد الإلكتروني</label>
<input id="email" type="email" autocomplete="email" required>

<label for="password">كلمة المرور (8 أحرف على الأقل)</label>
<input id="password" type="password" minlength="8" autocomplete="new-password" required>

<button id="submit" type="submit">إنشاء الحساب</button>
</form>

<button class="alt" id="switch" type="button">عندي حساب — تسجيل الدخول</button>
<button class="alt" id="logout" type="button" hidden>تسجيل الخروج</button>
<p id="msg" role="status"></p>
</section>
</main>
<footer>نصيب © 2026 — منصة للزواج الجاد</footer>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const client = window.supabase.createClient(
  "https://gdavyferkvekaprdgcft.supabase.co",
  "sb_publishable_QJnnLMv9pltgpeKQgmPGuw_c4CAyG7K"
);

const $ = id => document.getElementById(id);
let signup = true;

function message(text) {
  $("msg").textContent = text;
}

$("switch").onclick = () => {
  signup = !signup;
  $("extra").hidden = !signup;
  ["name","birth","gender","city"].forEach(id => {
    $(id).required = signup;
  });
  $("title").textContent = signup ? "إنشاء حساب جديد" : "تسجيل الدخول";
  $("submit").textContent = signup ? "إنشاء الحساب" : "دخول";
  $("switch").textContent = signup
    ? "عندي حساب — تسجيل الدخول"
    : "إنشاء حساب جديد";
  $("password").autocomplete = signup ? "new-password" : "current-password";
  message("");
};

$("authForm").onsubmit = async event => {
  event.preventDefault();
  $("submit").disabled = true;
  message("جاري التنفيذ...");

  try {
    const email = $("email").value.trim();
    const password = $("password").value;

    if (signup) {
      if (new Date($("birth").value) > new Date()) {
        message("تاريخ الميلاد غير صحيح.");
        return;
      }

      const { data, error } = await client.auth.signUp({
        email,
        password,
        options: {
          data: {
            display_name: $("name").value.trim(),
            birth_date: $("birth").value,
            gender: $("gender").value,
            city: $("city").value.trim()
          }
        }
      });

      if (error) throw error;

      if (data.session) {
        message("تم إنشاء الحساب بنجاح.");
        $("logout").hidden = false;
      } else {
        message("تم إرسال طلب التسجيل. افحص بريدك لتأكيد الحساب، ثم سجّل الدخول.");
      }
    } else {
      const { error } = await client.auth.signInWithPassword({
        email,
        password
      });
      if (error) throw error;
      message("تم تسجيل الدخول بنجاح.");
      $("logout").hidden = false;
    }
  } catch (error) {
    message("تعذر إكمال العملية: " + error.message);
  } finally {
    $("submit").disabled = false;
  }
};

$("logout").onclick = async () => {
  const { error } = await client.auth.signOut();
  if (error) {
    message("تعذر تسجيل الخروج: " + error.message);
    return;
  }
  $("logout").hidden = true;
  message("تم تسجيل الخروج.");
};

(async () => {
  const { data } = await client.auth.getSession();
  if (data.session) {
    $("logout").hidden = false;
    message("أنت مسجل الدخول بالفعل.");
  }
})();
</script>
</body>
  </html>
